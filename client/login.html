<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TravelGo Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .login-box p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            background: #0077b6;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #023e8a;
        }

        #message {
            margin-top: 15px;
            text-align: center;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h1>🌍 TravelGo</h1>

        <p>Admin Login</p>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div id="message"></div>

    </div>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const username =
                    document.getElementById("username").value;

                const password =
                    document.getElementById("password").value;

                try {

                    const response = await fetch("/api/login", {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        credentials: "include",

                        body: JSON.stringify({
                            username: username,
                            password: password
                        })

                    });

                    const data = await response.json();

                    if (data.success) {

                        window.location.href = "/admin.html";

                    } else {

                        document.getElementById("message").textContent =
                            data.message;

                    }

                } catch (error) {

                    document.getElementById("message").textContent =
                        "Login failed. Please try again.";

                }

            });

    </script>

</body>

</html>
