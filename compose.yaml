services:
  frontend:
    build: ./client
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      - backend
    networks:
      - travelnet
    restart: unless-stopped

  backend:
    build: ./server
    environment:
      PORT: "5000"
      DB_HOST: database
      DB_USER: traveluser
      DB_PASSWORD: ${DB_PASSWORD:?required}
      DB_NAME: travelbooking
      SESSION_SECRET: ${SESSION_SECRET:?required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?required}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - travelnet
    restart: unless-stopped

  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: travelbooking
      MYSQL_USER: traveluser
      MYSQL_PASSWORD: ${DB_PASSWORD:?required}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - travelnet
    restart: unless-stopped

networks:
  travelnet:
    external: true
    name: travelbooking-network

volumes:
  mysql_data:
