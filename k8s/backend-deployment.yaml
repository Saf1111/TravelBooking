
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travelbooking-backend
  namespace: travelbooking
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: travelbooking-backend
  template:
    metadata:
      labels:
        app: travelbooking-backend
    spec:
      containers:
        - name: backend
          image: travelbooking-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: DB_HOST
              value: "172.18.0.1"
            - name: DB_USER
              value: "traveluser"
            - name: DB_NAME
              value: "travelbooking"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_PASSWORD
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SESSION_SECRET
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: ADMIN_PASSWORD

